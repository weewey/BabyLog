name: Orchestrator

# Event-driven PM tick loop. Fires when a human touches the board or an agent
# opens/updates a PR. Skips runs triggered by the workflow's own writes
# (github-actions[bot]) to prevent infinite loops.

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened, closed]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: orchestrator
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  pm-tick:
    name: PM tick
    runs-on: ubuntu-latest
    # Filter out events triggered by the workflow's own writes.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anthropic SDK
        run: pip install --quiet anthropic

      - name: Run PM tick
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/orchestrator.py
